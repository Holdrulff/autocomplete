services:
  backend:
    image: autocomplete-backend:dev
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: autocomplete-frontend:dev
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost/health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s